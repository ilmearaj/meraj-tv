plugins {
    id 'com.android.application'
}

android {
    namespace 'app.ilmearaj.tv'
    compileSdk 34

    defaultConfig {
        applicationId "app.ilmearaj.tv"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
    }

    // مفتاح توقيع ثابت: يسمح بالتحديث فوق النسخة القديمة (adb install -r) بدون مسح الإعدادات
    signingConfigs {
        debug {
            storeFile file('meraj.keystore')
            storePassword 'meraj-tv-2026'
            keyAlias 'meraj'
            keyPassword 'meraj-tv-2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ملفات الصوت تبقى كما هي (بدون ضغط) عشان تشتغل من الأصول
    androidResources {
        noCompress 'mp3', 'm4a', 'ogg', 'txt'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.9.0'
}
